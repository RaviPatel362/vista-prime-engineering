name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # ┌─────────────────────────────────────────────────────────────┐
      # │ IMPORTANT: Change this to match your repo name.            │
      # │ Example: for github.com/ruchitpatel/vpe-website the path   │
      # │ is /vpe-website                                             │
      # │                                                              │
      # │ If your repo is named <your-username>.github.io (user/org  │
      # │ pages), DELETE this entire env: block — the site is served  │
      # │ from root.                                                   │
      # └─────────────────────────────────────────────────────────────┘
      NEXT_PUBLIC_BASE_PATH: /vista-prime-engineering
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4